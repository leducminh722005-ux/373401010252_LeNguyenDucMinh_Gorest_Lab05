
name: GoRest API CI Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  api-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Newman
        run: npm install -g newman

      - name: Run GoRest API Tests with CSV
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: |
          newman run GoRest.postman_collection.json -e GoRest.postman_environment.json -d users.csv --env-var "Token=$GOREST_TOKEN"
